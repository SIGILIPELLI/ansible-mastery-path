site_name: Ansible Mastery Path
site_description: "A free Ansible course: inventory, playbooks, idempotency, roles, variables, vault, custom modules, rolling updates, testing and running automation at scale."
site_url: https://sigilipelli.github.io/ansible-mastery-path/
repo_url: https://github.com/sigilipelli/ansible-mastery-path
repo_name: ansible-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/progress-tracker.css

extra_javascript:
  - javascripts/progress-tracker.js

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Ansible Foundations":
      - Overview: level-1/index.md
      - "01 · What Ansible Is and How It Works": level-1/01-what-ansible-is.md
      - "02 · Ad-Hoc Commands, Modules and ansible-doc": level-1/02-adhoc-and-docs.md
      - "03 · Inventory: Hosts, Groups and Variables": level-1/03-inventory.md
      - "04 · Playbook Anatomy: Plays, Tasks and Modules": level-1/04-playbook-anatomy.md
      - "05 · Idempotency, Changed and Check Mode": level-1/05-idempotency.md
      - "06 · Variables and Facts": level-1/06-variables-facts.md
      - "07 · Conditionals, Loops and Registered Results": level-1/07-conditionals-loops.md
      - "08 · Templates and Handlers": level-1/08-templates-handlers.md
      - "09 · Debugging and Reading Failures": level-1/09-debugging-playbooks.md
      - "10 · Project — A Verified Baseline Playbook": level-1/10-project-baseline-playbook.md
  - "Level 2 · Structure and Safety":
