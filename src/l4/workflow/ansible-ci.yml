name: ansible-ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ansible-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@0000000000000000000000000000000000000000    # replace with the real commit SHA you have reviewed
      - uses: actions/setup-python@1111111111111111111111111111111111111111  # replace with the real commit SHA you have reviewed
        with:
          python-version: "3.12"
      - name: Install pinned tooling
        run: |
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Run the Ansible pipeline
        run: ./ci.sh playbooks/site.yml inventories/ci/hosts.ini
